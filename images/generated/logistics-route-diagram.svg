<svg viewBox="0 0 700 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simplified map illustrating shipping routes from Shenzhen, China to Europe, North America, and Japan">
<style>
  .lg-lbl{font-family:'IBM Plex Mono',monospace;font-size:12px;fill:#101826;}
  .lg-sub{font-family:'IBM Plex Sans',sans-serif;font-size:11px;fill:#5B6B7D;}
</style>
<rect x="0" y="0" width="700" height="320" fill="#F6F8FA"/>
<g stroke="#D7DEE6" stroke-width="1">
  <line x1="0" y1="80" x2="700" y2="80"/>
  <line x1="0" y1="160" x2="700" y2="160"/>
  <line x1="0" y1="240" x2="700" y2="240"/>
</g>
<circle cx="580" cy="170" r="6" fill="#3E7CB1"/>
<text x="592" y="174" class="lg-lbl">Shenzhen, CN</text>
<text x="592" y="188" class="lg-sub">Origin</text>

<circle cx="150" cy="100" r="6" fill="#6FA8DC"/>
<text x="120" y="88" class="lg-lbl" text-anchor="middle">Europe</text>

<circle cx="90" cy="150" r="6" fill="#6FA8DC"/>
<text x="90" y="140" class="lg-lbl" text-anchor="middle">North America</text>

<circle cx="620" cy="110" r="6" fill="#6FA8DC"/>
<text x="620" y="98" class="lg-lbl" text-anchor="middle">Japan</text>

<path d="M580 170 Q 380 60 150 100" stroke="#3E7CB1" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
<path d="M580 170 Q 320 220 90 150" stroke="#3E7CB1" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
<path d="M580 170 Q 600 140 620 110" stroke="#3E7CB1" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
</svg>

<svg width="640" height="520" viewBox="0 0 640 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of a tablet device and a small appliance connected by circuit-line patterns" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- blueprint grid -->
  <g stroke="#1B3350" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="200" x2="640" y2="200"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="0" y1="440" x2="640" y2="440"/>
    <line x1="120" y1="0" x2="120" y2="520"/>
    <line x1="320" y1="0" x2="320" y2="520"/>
    <line x1="520" y1="0" x2="520" y2="520"/>
  </g>

  <!-- tablet silhouette -->
  <rect x="70" y="120" width="180" height="240" rx="10" stroke="#93A5BC" stroke-width="1.6"/>
  <rect x="90" y="146" width="140" height="170" stroke="#3E7CB1" stroke-width="1.2" opacity=".6"/>
  <line x1="160" y1="336" x2="160" y2="336" stroke="#93A5BC" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="336" r="3" fill="#93A5BC"/>

  <!-- appliance silhouette (disposer) -->
  <rect x="400" y="260" width="150" height="130" rx="6" stroke="#93A5BC" stroke-width="1.6"/>
  <circle cx="475" cy="290" r="26" stroke="#3E7CB1" stroke-width="1.6"/>
  <circle cx="475" cy="290" r="14" stroke="#3E7CB1" stroke-width="1" opacity=".6"/>
  <line x1="420" y1="360" x2="530" y2="360" stroke="#93A5BC" stroke-width="1.2" opacity=".6"/>

  <!-- circuit trace connecting the two, drawn as one path for animation -->
  <path id="circuit-path" d="M250 200 H300 V150 H370 V230 H400"
        stroke="#6FA8DC" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <circle cx="300" cy="200" r="3.5" fill="#6FA8DC"/>
  <circle cx="370" cy="150" r="3.5" fill="#6FA8DC"/>
  <circle cx="400" cy="230" r="3.5" fill="#6FA8DC"/>
  <circle cx="250" cy="200" r="3.5" fill="#6FA8DC"/>
</svg>

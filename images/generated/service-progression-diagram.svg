<svg width="960" height="220" viewBox="0 0 960 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four-stage service progression: Ready Inventory, Light OEM, Full ODM/OEM, System Integration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <line x1="40" y1="190" x2="920" y2="190" stroke="#D7DEE6" stroke-width="1"/>

  <!-- Stage 1 -->
  <rect x="60" y="150" width="150" height="40" fill="#ECF0F4" stroke="#3E7CB1" stroke-width="1.4"/>
  <text x="135" y="174" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#101826">READY INVENTORY</text>

  <!-- arrow -->
  <path d="M212 170h34" stroke="#3E7CB1" stroke-width="1.4"/>
  <path d="M240 165l7 5-7 5" stroke="#3E7CB1" stroke-width="1.4" fill="none"/>

  <!-- Stage 2 -->
  <rect x="255" y="120" width="170" height="70" fill="#ECF0F4" stroke="#3E7CB1" stroke-width="1.4"/>
  <text x="340" y="159" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#101826">LIGHT OEM</text>

  <path d="M427 155h34" stroke="#3E7CB1" stroke-width="1.4"/>
  <path d="M455 150l7 5-7 5" stroke="#3E7CB1" stroke-width="1.4" fill="none"/>

  <!-- Stage 3 -->
  <rect x="470" y="80" width="190" height="110" fill="#ECF0F4" stroke="#3E7CB1" stroke-width="1.6"/>
  <text x="565" y="139" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#101826">FULL ODM/OEM</text>

  <path d="M662 135h34" stroke="#3E7CB1" stroke-width="1.4"/>
  <path d="M690 130l7 5-7 5" stroke="#3E7CB1" stroke-width="1.4" fill="none"/>

  <!-- Stage 4 -->
  <rect x="705" y="40" width="200" height="150" fill="#3E7CB1" stroke="#3E7CB1" stroke-width="1.6"/>
  <text x="805" y="119" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#FFFFFF">SYSTEM INTEGRATION</text>

  <text x="135" y="210" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5B6B7D">01</text>
  <text x="340" y="210" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5B6B7D">02</text>
  <text x="565" y="210" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5B6B7D">03</text>
  <text x="805" y="210" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5B6B7D">04</text>
</svg>
